[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
demo = [
    "jupyterlab>=4.6.6",
    "octave-kernel>=1.1.1"
]
dev = [
    { include-group = "demo" },
    { include-group = "doc" },
    { include-group = "style" },
    { include-group = "test" },
    "pandas>=3.1.1",
    "ruamel.yaml>=0.19.1"
]
doc = [
    "myst-parser>=5.2.0",
    "pydata-sphinx-theme>=0.24.0",
    "setuptools>=84.2.1",
    "sphinx>=9.0.4",
    "sphinx-argparse>=0.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-togglebutton>=0.4.5",
    "sphinxcontrib-bibtex>=2.7.0",
    "sphinxcontrib-matlabdomain @ git+https://github.com/sphinx-contrib/matlabdomain.git@0270cc88531f21c38ef741a5408c84ec46870716 ; python_version >= '3.11'",
    "sphinxcontrib-mermaid>=2.1.1",
    "urllib3>=2.8.0"
]
style = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "sourcery>=1.46.0"
]
test = [
    "coverage>=7.17.3",
    "pytest>=9.0.0"
]

[project]
authors = [{ name = "bidspm developers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dependencies = [
    "bsmschema>=0.1.1",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0"
]
description = "SPM centric bids app"
# Version from setuptools_scm
dynamic = ["version"]
license = { text = "GPL-3.0" }
maintainers = [{ name = "Rémin Gau", email = "remi.gau@gmail.com" }]
name = "bidspm"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
bidspm = "bidspm.cli:cli"
validate_model = "bidspm.validate:cli"

[project.urls]
Homepage = "https://bidspm.readthedocs.io"

[tool.codespell]
builtin = "clear,rare"
ignore-words-list = "fo,te,als,ane,nin,fot,fwe,commun,ons,buildd,anc"
skip = "*.tsv,*.json,*.nii*,*.js,*.svg,*.eps,*.log,.git,env,build,lib,options,outputs,inputs,bids-examples,stats_model,coverage_html,ds001734"

[tool.coverage.report]
omit = [
    "*_version.py",
    "__init__.py"
]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true

[tool.hatch.build.hooks.vcs]
version-file = "src/bidspm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bidspm"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "bsmschema.models",
    "rich",
    "rich.logging",
    "rich_argparse",
    "bidspm._version",
    "pydantic"  # just to silence errors
]

[tool.pytest.ini_options]
addopts = "-ra -q -vv --showlocals --strict-markers --strict-config"
# filterwarnings = ["error"]
# log_cli_level = "warning"
minversion = "9.0.0"
norecursedirs = "data"
testpaths = ["tests/"]
xfail_strict = true

[tool.ruff]
extend-exclude = [
    "demos/MoAE/moae_01_bids_app.ipynb",
    "demos/renaming/spm_2_bids_filenames.ipynb",
    "lib",
    "src/bidspm/_version.py"
]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "D100",
    "D101",
    "D103",
    "D104",
    "F841"
]
select = [
    "B",  # flake8-bugbear
    "C90",  # mccabe
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W"  # pycodestyle warnings
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.per-file-ignores]
"WIP/**" = ["D"]
"demos/**" = ["D"]
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
