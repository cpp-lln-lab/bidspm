---
name: test notebooks

on:

    pull_request:
        branches:
        -   main
        paths:
        -   '**.m'
        -   .github/workflows/*system*
        -   lib

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

env:
    SPM_VERSION: 26.10.01

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    system_tests_matlab:

    # only trigger update on upstream repo
        if: github.repository_owner == 'cpp-lln-lab'

        runs-on: ubuntu-latest

        steps:
        -   name: Install dependencies
            run: |
                sudo apt-get -y -qq update
                sudo apt-get -y install unzip wget tree

        -   name: Install MATLAB
            uses: matlab-actions/setup-matlab@v3.1.0
            with:
          # MATLAB release to set up
                release: R2026b

        -   name: Clone bidspm
            uses: actions/checkout@v7
            with:
                submodules: recursive
                fetch-depth: 0

        -   name: Install SPM
            run: |
                curl -fsSL -o spm.zip https://github.com/spm/spm/releases/download/${SPM_VERSION}/spm_${SPM_VERSION}.zip
                unzip -q spm.zip
                rm spm.zip

        -   name: Test notebooks
            uses: matlab-actions/run-command@v3.3.0
            with:
                command: |
                    root_dir = getenv('GITHUB_WORKSPACE');
                    addpath(fullfile(root_dir, 'spm'));
                    cd(fullfile(root_dir, 'demos'));
                    run test_notebooks;
